repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-xml

  - repo: local
    hooks:
      - id: dotnet-build
        name: dotnet build (Release, zero warnings)
        entry: dotnet build Fornach.slnx -c Release -v q --nologo
        language: system
        pass_filenames: false
        files: \.(fs|fsproj|slnx|props)$

      - id: dotnet-test
        name: dotnet test (unit, property and balance suites)
        entry: dotnet test Fornach.slnx --nologo -v q
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.(fs|fsproj)$

      # The engine's surface is what a game compiles against, so a push has to
      # prove it still packs. The packages are not committed (see .gitignore);
      # this only checks the pack succeeds at the version in Directory.Build.props.
      - id: dotnet-pack
        name: dotnet pack (engine packages still build)
        entry: bash -c 'set -e; dotnet pack src/Fornach.Spatial -c Release --nologo; dotnet pack src/Fornach.Domain -c Release --nologo; dotnet pack src/Fornach.Engine -c Release --nologo'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: \.(fs|fsproj|props)$
