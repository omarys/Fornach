# Dev and build dependencies, and the tasks that drive them.
#
# Pinned to the `10` major rather than "latest": the projects target net10.0, so
# a major bump would silently install a runtime the build cannot use.
[tools]
dotnet = "10"
pre-commit = "latest"

[env]
# Keep the SDK out of the system-wide lookup path. Without this a plain `dotnet`
# resolves against /usr/lib64/dotnet, which ships .NET 8 only, and every run
# fails with "You must install or update .NET". mise sets this for the `dotnet`
# tool already; it is stated here so the requirement is visible in the repo.
DOTNET_MULTILEVEL_LOOKUP = "0"

[tasks.build]
description = "Build the whole solution in Release"
run = "dotnet build Fornach.slnx -c Release --nologo"

[tasks.test]
description = "Run the test suite"
run = "dotnet test Fornach.slnx --nologo -v q"

[tasks.pack]
description = "Pack the engine into the local feed that games consume (packages/)"
run = """
set -e
dotnet pack src/Fornach.Spatial -c Release --nologo
dotnet pack src/Fornach.Domain  -c Release --nologo
dotnet pack src/Fornach.Engine  -c Release --nologo
echo "packed Fornach $(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props) into packages/"
echo "Games pin this as FornachVersion. Re-packing under an existing version is"
echo "invisible to them: NuGet caches by version, so bump <Version> first."
"""

[tasks.version]
description = "Show the engine version games are pinning"
run = "grep -oP '(?<=<Version>)[^<]+' Directory.Build.props"

[tasks.game]
description = "Launch the interactive Spectre.Console CLI arena (the Trucked game, from ../trucked)"
run = "dotnet run --project ../trucked/src/Trucked.Cli"

[tasks.sim]
description = "Run the headless balance simulation harness in the Trucked game; pass args, e.g. `mise run sim -- -a1 'Veteran Fighter' -a2 'Veteran Mage' -n 500`"
run = "dotnet run --project ../trucked/src/Trucked.Cli -c Release -- --sim"

[tasks.benchmark]
description = "Run standard balance benchmarks across representative archetype matchups"
run = "dotnet run --project ../trucked/src/Trucked.Cli -c Release -- --sim -a1 'Veteran Duelist' -a2 'Veteran Mage' -n 100"

[tasks.fmt]
description = "Format all F# files using fantomas"
run = "dotnet fantomas src tests"

[tasks.fmt-check]
description = "Check F# code formatting without making changes"
run = "dotnet fantomas check src tests"

[tasks.hooks]
description = "Install the git hooks (run once after cloning)"
run = "pre-commit install --install-hooks && pre-commit install --hook-type pre-push"

[tasks.hooks-run]
description = "Run every hook against the whole tree"
run = "pre-commit run --all-files"
